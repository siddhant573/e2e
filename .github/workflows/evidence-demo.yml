name: evidence-demo

# Throwaway: produces evidence packs as Actions artifacts on GitHub-hosted
# runners, so the hosted viewer can open them from a link. Not part of any PR.
on:
  push:
    branches: [evidence-demo]
  workflow_dispatch:

env:
  E2E_TELEMETRY_DISABLED: '1'

permissions:
  contents: read
  actions: read

jobs:
  testbed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Install browsers
        run: pnpm --filter @e2e-dev/web exec playwright install chromium --with-deps
      - name: Testbed
        run: pnpm --filter @e2e-dev/testbed test
      - name: Upload evidence
        id: evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-testbed
          path: apps/testbed/.e2e/evidence/*.evidence
          if-no-files-found: error
          retention-days: 30
      - name: Link the evidence
        if: ${{ !cancelled() && steps.evidence.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          link="https://evidence.lambdatest.com/?pack=$(node -e 'process.stdout.write(encodeURIComponent(process.env.ARTIFACT_URL))')"
          echo "[Open the testbed run in the evidence viewer]($link)" >> "$GITHUB_STEP_SUMMARY"
          echo "EVIDENCE_LINK $link"

  web-benchmark-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Install browsers
        run: pnpm --filter @e2e-dev/web exec playwright install chromium --with-deps
      # Replays the committed recordings; with no model key a step that needs one is recorded as broken.
      - name: Agentic suite from recordings
        continue-on-error: true
        run: pnpm --filter @e2e-dev/web-benchmark run test:agent --strict-cache
      - name: Upload evidence
        id: evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-web-benchmark-agent
          path: apps/web-benchmark/.e2e/evidence/*.evidence
          if-no-files-found: error
          retention-days: 30
      - name: Link the evidence
        if: ${{ !cancelled() && steps.evidence.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          link="https://evidence.lambdatest.com/?pack=$(node -e 'process.stdout.write(encodeURIComponent(process.env.ARTIFACT_URL))')"
          echo "[Open the web benchmark agent run in the evidence viewer]($link)" >> "$GITHUB_STEP_SUMMARY"
          echo "EVIDENCE_LINK $link"
